<div *ngIf="showLoginWindow" class="loginWindow">
  <div *ngIf="showLogin" class="login">
    <h2>Login</h2>
        <form>
          <label for="username">Username</label>
          <input type="text" id="username" name="username"  [(ngModel)]="userNameTemp" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password"  [(ngModel)]="passwordTemp" required>

          <button type="submit" (click)="login()">Login</button>
          <button type="register" (click)="switchBetweenLoginRegister()">Register</button>
        </form>
      </div>
  <div *ngIf="showRegister" class="register">
    <h2>Register</h2>
        <form>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" [(ngModel)]="registerdUserTemp.fullName" required>

          <label for="username">Username</label>
          <input type="text" id="username" name="username" [(ngModel)]="registerdUserTemp.userName" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="registerdUserTemp.password" required>

          <label for="securityLevel">Security Level Status</label>
          <select id="securityLevel" name="securityLevel"[(ngModel)]="registerdUserTemp.securityLevelStatus"  required>
            <option value="">--Select Level--</option>
            <option value="LOW">Low</option>
            <option value="MIDDLE">Middle</option>
            <option value="HIGH">High</option>
          </select>

          <!-- Show these fields only if HIGH is selected -->
          <div *ngIf="registerdUserTemp.securityLevelStatus === 'HIGH' && mainDataService.adminPassword" class="high-priority-auth">
            <label for="highPriorityUser">Admin Username (ID 1)</label>
            <input type="text" id="highPriorityUser" [(ngModel)]="adminUserNameChecker" name="highPriorityUser" required>
            <br>
            <label for="highPriorityPassword">Admin Password (ID 1)</label>
            <input type="password" id="highPriorityPassword" [(ngModel)]="adminPasswordChecker" name="highPriorityPassword" required>
          </div>

          <button type="submit" (click)="register()">Register</button>
           <button type="login" (click)="switchBetweenLoginRegister()">Login</button>
        </form>
  </div>
</div>
